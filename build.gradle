plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.37'
group = 'pl.crimeandlaw'
base { archivesName = 'crimeandlaw' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
// Opt-in graphical check with fixture data; excluded from normal builds/JARs.
def financeSmoke = providers.gradleProperty('financeSmoke').isPresent()
if (financeSmoke) sourceSets.main.java.srcDir('src/financeTest/java')
if (providers.gradleProperty('hudSmoke').isPresent()) sourceSets.main.java.srcDir('src/hudTest/java')
def uiSmoke = providers.gradleProperty('uiSmoke').isPresent()
def serverSmoke = providers.gradleProperty('serverSmoke').isPresent()
def serverSmokeId = providers.gradleProperty('serverSmokeId').getOrElse('current')
def uiSmokeId = providers.gradleProperty('uiSmokeId').getOrElse('current')
def networkSmoke = providers.gradleProperty('networkSmoke').isPresent()
def networkSmokeId = providers.gradleProperty('networkSmokeId').getOrElse('net16a')
def captureSmoke = providers.gradleProperty('captureSmoke').isPresent()
def captureRole = providers.gradleProperty('captureRole').getOrElse('owner')
if (captureSmoke) sourceSets.main.java.srcDir('src/captureTest/java')
if (uiSmoke) sourceSets.main.java.srcDir('src/uiTest/java')
if (serverSmoke) sourceSets.main.java.srcDir('src/serverTest/java')
if (networkSmoke) sourceSets.main.java.srcDir('src/networkTest/java')
neoForge {
    version = '21.1.248'
    runs {
        if (financeSmoke) {
            financeServer {
                server(); programArgument '--nogui'
                gameDirectory = file('run-finance-server')
                jvmArgument '-Xmx1300m'
                systemProperty 'crimeandlaw.financeSmoke', 'true'
                systemProperty 'crimeandlaw.financeRestart', providers.gradleProperty('financeRestart').getOrElse('false')
                systemProperty 'crimeandlaw.financeOutput', file('build/finance-smoke').absolutePath
            }
            ['owner', 'member'].each { financeRole ->
                create('finance' + financeRole.capitalize()) {
                    client(); gameDirectory = file('run-finance-' + financeRole)
                    jvmArgument '-Xmx1300m'
                    systemProperty 'crimeandlaw.financeRole', financeRole
                    systemProperty 'crimeandlaw.financeOutput', file('build/finance-smoke').absolutePath
                    def user = financeRole == 'owner' ? 'Owner29' : 'Member29'
                    programArguments.addAll '--username', user, '--uuid', java.util.UUID.nameUUIDFromBytes(('OfflinePlayer:' + user).getBytes('UTF-8')).toString(), '--width', '1600', '--height', '900'
                }
            }
        }
        if (captureSmoke) {
            captureServer {
                server(); programArgument '--nogui'
                gameDirectory = file('run-capture-server')
                jvmArgument '-Xmx1500m'
                systemProperty 'crimeandlaw.captureSmoke', 'true'
                systemProperty 'crimeandlaw.captureRestart', providers.gradleProperty('captureRestart').getOrElse('false')
                systemProperty 'crimeandlaw.captureOutput', file('build/capture-smoke').absolutePath
            }
            captureClient {
                client(); gameDirectory = file('run-capture-'+captureRole)
                jvmArgument '-Xmx1300m'
                systemProperty 'crimeandlaw.captureRole', captureRole
                systemProperty 'crimeandlaw.captureOutput', file('build/capture-smoke').absolutePath
                def user = captureRole == 'owner' ? 'CaptureOwner' : 'CaptureRival'
                programArguments.addAll '--username', user, '--uuid', java.util.UUID.nameUUIDFromBytes(('OfflinePlayer:'+user).getBytes('UTF-8')).toString(), '--width', '1600', '--height', '900'
            }
        }
        client {
            client()
            if (uiSmoke) {
                systemProperty 'crimeandlaw.uiSmoke', 'true'
                systemProperty 'crimeandlaw.logoFixtures', file('src/test/resources/logo-formats.json').absolutePath
                systemProperty 'crimeandlaw.uiSmokeOutput', file('build/ui-smoke-'+uiSmokeId).absolutePath
                systemProperty 'crimeandlaw.actualTerrainView', file('build/server-smoke-'+providers.gradleProperty('terrainFixtureId').getOrElse('terrain16a')+'/view.json').absolutePath
                programArguments.addAll '--width', providers.gradleProperty('uiWidth').getOrElse('1920'), '--height', providers.gradleProperty('uiHeight').getOrElse('1080')
            }
        }
        server {
            server(); programArgument '--nogui'
            if (serverSmoke) {
                systemProperty 'crimeandlaw.serverSmoke', 'true'
                systemProperty 'crimeandlaw.serverSmokeOutput', file('build/server-smoke-'+serverSmokeId).absolutePath
                gameDirectory = file('run-server-smoke-'+serverSmokeId)
            }
        }
        if (networkSmoke) {
            networkServer {
                server(); programArgument '--nogui'
                gameDirectory = file('run-network-server-'+networkSmokeId)
                jvmArgument '-Xmx1200m'
                jvmArgument '-Djava.awt.headless=true'
                systemProperty 'crimeandlaw.networkSmokeOutput', file('build/network-smoke-'+networkSmokeId).absolutePath
                systemProperty 'crimeandlaw.networkSmokeGang', 'Test interfejsu '+networkSmokeId
                systemProperty 'crimeandlaw.networkSmokePersistence', providers.gradleProperty('networkPersistence').getOrElse('false')
            }
            networkOwner {
                client(); gameDirectory = file('run-network-owner-'+networkSmokeId)
                jvmArgument '-Xmx1200m'
                systemProperty 'crimeandlaw.networkSmokeRole', 'owner'
                systemProperty 'crimeandlaw.networkSmokeOutput', file('build/network-smoke-'+networkSmokeId).absolutePath
                systemProperty 'crimeandlaw.networkSmokeGang', 'Test interfejsu '+networkSmokeId
                programArguments.addAll '--username', 'Owner16', '--uuid', java.util.UUID.nameUUIDFromBytes('OfflinePlayer:Owner16'.getBytes('UTF-8')).toString(), '--width', '960', '--height', '540'
            }
            networkMember {
                client(); gameDirectory = file('run-network-member-'+networkSmokeId)
                jvmArgument '-Xmx1200m'
                systemProperty 'crimeandlaw.networkSmokeRole', 'member'
                systemProperty 'crimeandlaw.networkSmokeOutput', file('build/network-smoke-'+networkSmokeId).absolutePath
                systemProperty 'crimeandlaw.networkSmokeGang', 'Test interfejsu '+networkSmokeId
                programArguments.addAll '--username', 'Member16', '--uuid', java.util.UUID.nameUUIDFromBytes('OfflinePlayer:Member16'.getBytes('UTF-8')).toString(), '--width', '960', '--height', '540'
            }
        }
    }
    mods { crimeandlaw { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.crimeandlaw
    }
}
dependencies {
    // Ship the readers inside the mod; players need no separate codec installation.
    ['imageio-core', 'imageio-metadata', 'imageio-webp', 'imageio-bmp',
     'imageio-tiff', 'imageio-jpeg', 'imageio-psd', 'imageio-tga',
     'imageio-pcx', 'imageio-pnm', 'imageio-icns'].each { artifact ->
        jarJar(implementation("com.twelvemonkeys.imageio:${artifact}")) {
            version { strictly '[3.15.3,3.16)'; prefer '3.15.3' }
        }
    }
    ['common-lang', 'common-io', 'common-image'].each { artifact ->
        jarJar(implementation("com.twelvemonkeys.common:${artifact}")) {
            version { strictly '[3.15.3,3.16)'; prefer '3.15.3' }
        }
    }
    jarJar(implementation('com.github.weisj:jsvg')) {
        version { strictly '[2.0.0,3.0)'; prefer '2.0.0' }
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// NeoForge 1.21.1 needs library dependencies on the development launcher classpath.
configurations.additionalRuntimeClasspath.extendsFrom(configurations.jarJar)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') {
    useJUnitPlatform()
    // End-to-end image tests retain two worst-case detailed assets plus codec copies.
    maxHeapSize = '1536m'
}
// Keep fixture automation out of releases even after a prior smoke-test compile.
tasks.named('jar') {
    exclude 'pl/crimeandlaw/client/GangUiSmokeTest*', 'pl/crimeandlaw/territory/TerrainServerSmoke*',
        'pl/crimeandlaw/client/GangMultiplayerSmoke*', 'pl/crimeandlaw/gang/GangNetworkPersistenceSmoke*',
        'pl/crimeandlaw/client/CaptureClientSmoke*', 'pl/crimeandlaw/territory/CaptureServerSmoke*',
        'pl/crimeandlaw/client/FinanceClientSmoke*', 'pl/crimeandlaw/gang/FinanceServerSmoke*'
    exclude 'pl/crimeandlaw/client/CaptureHudSmoke*'
}
tasks.named('wrapper') { distributionType = Wrapper.DistributionType.BIN }

