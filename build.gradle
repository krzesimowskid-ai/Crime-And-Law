plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.3'
group = 'pl.crimeandlaw'
base { archivesName = 'crimeandlaw' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
// Opt-in graphical check with fixture data; excluded from normal builds/JARs.
def uiSmoke = providers.gradleProperty('uiSmoke').isPresent()
if (uiSmoke) sourceSets.main.java.srcDir('src/uiTest/java')
neoForge {
    version = '21.1.248'
    runs {
        client {
            client()
            if (uiSmoke) {
                systemProperty 'crimeandlaw.uiSmoke', 'true'
                programArguments.addAll '--width', '1920', '--height', '1080'
            }
        }
        server { server(); programArgument '--nogui' }
    }
    mods { crimeandlaw { sourceSet sourceSets.main } }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
// Keep fixture automation out of releases even after a prior smoke-test compile.
tasks.named('jar') { exclude 'pl/crimeandlaw/client/GangUiSmokeTest*' }
tasks.named('wrapper') { distributionType = Wrapper.DistributionType.BIN }

